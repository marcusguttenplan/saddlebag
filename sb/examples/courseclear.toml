[desk]
name = "Course Clear"

[aws]
profile = "cc-admin"

[gcp]
config = "default"

[git]
email = "marcus@courseclear.io"
name  = "Marcus Guttenplan"

[ssh]
key = "~/.ssh/id_courseclear"

[env]
ORGANIZATION = "courseclear"

# ---------------------------------------------------------------------------
# Model gateway configuration
# ---------------------------------------------------------------------------

[llm]
default_provider = "google"
default_model    = "gemini-2.5-flash"

[llm.routing]
plan      = "google/gemini-2.5-pro"
implement = "google/gemini-2.5-pro"
classify  = "ollama/gemma4:latest"          # local — zero cost
review    = "google/gemini-2.5-pro"
verify    = "google/gemini-2.5-flash"

[llm.budget]
daily_limit_usd = 30.00
warn_at_usd     = 25.00

[llm.fallback]
primary  = "google"
fallback = ["anthropic", "ollama/gemma4:latest"]

[llm.providers.ollama]
base_url = "http://localhost:11434"
models   = ["gemma4:latest"]

# ---------------------------------------------------------------------------
# Context assembly
# ---------------------------------------------------------------------------

[harness]
max_context_tokens     = 200000
progressive_disclosure = true
gateway_url            = "http://localhost:7474"
