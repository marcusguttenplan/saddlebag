# Build the sb CLI for macOS and attach archives to the GitHub Release for the pushed tag.
# Create a GitHub Release with tag v1.2.3 (and optionally upload Saddlebag.app manually); this job adds sb binaries.

name: Release sb

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  sb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sb/go.mod

      - name: Build and package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd sb
          for arch in arm64 amd64; do
            out="sb-darwin-${arch}"
            GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/marcusguttenplan/sb/cmd.version=${VERSION}" \
              -o "../dist/${out}" .
            tar -C ../dist -czf "../dist/${out}.tar.gz" "$out"
          done
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 dist/sb-darwin-*.tar.gz > dist/checksums-sha256.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums-sha256.txt
